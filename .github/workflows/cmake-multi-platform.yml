# This workflow builds rdxgraphics on multiple platforms using vcpkg for
# dependency management (glfw3, glew, glm, imgui, imguizmo, spdlog, entt,
# assimp, eigen3 -- see vcpkg.json).

name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations.
      fail-fast: false

      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image>
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
      - uses: actions/checkout@v4

      - name: Set reusable strings
        # Turn repeated input strings (such as the build output directory) into step outputs.
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      # --- vcpkg dependency setup -------------------------------------------------

      - name: Install Linux system packages for GLFW/Wayland/OpenGL
        # vcpkg builds glfw3 (with the "wayland" feature, per vcpkg.json) from
        # source on Linux. glfw3's own CMake does find_package(OpenGL REQUIRED),
        # so the GL/GLX dev libraries need to be present too, not just Wayland/X11.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxfixes-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            pkg-config

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Set up MSVC developer environment
        # Ninja (unlike the Visual Studio generator) needs cl.exe/INCLUDE/LIB/PATH
        # set up explicitly -- windows-latest doesn't do this for you by default.
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install vcpkg and dependencies
        uses: lukka/run-vcpkg@v11
        with:
          # Baseline commit is pinned via "builtin-baseline" in vcpkg.json,
          # so run-vcpkg knows which vcpkg port versions to resolve against.
          vcpkgJsonGlob: 'vcpkg.json'

      # --- Configure / build / test ------------------------------------------------

      - name: Configure CMake
        # Uses the "vcpkg" preset from CMakePresets.json, which wires up
        # CMAKE_TOOLCHAIN_FILE from $VCPKG_ROOT (exported by run-vcpkg above).
        run: >
          cmake --preset vcpkg
          -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }}
